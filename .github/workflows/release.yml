# Cross-platform release pipeline for SaintHarness (CLI/TUI + Native Tauri v2 Desktop App).
#   1. Preflight validates semver, clean-room, firewall, 100% UI prototype parity, clippy, and tests.
#   2. CLI build matrix produces verified binaries + packages for:
#      - Linux x86_64 (.tar.gz + Debian/Ubuntu amd64.deb built on ubuntu-22.04 with GLIBC <= 2.35)
#      - Linux aarch64 (.tar.gz + Debian/Ubuntu arm64.deb built on ubuntu-22.04-arm with GLIBC <= 2.35)
#      - macOS Apple Silicon arm64 (.tar.gz + lipo check + optional codesign)
#      - macOS Intel x86_64 (.tar.gz + lipo check + optional codesign)
#      - Windows x64 MSVC (.zip + native Windows CLI smoke)
#   3. Desktop build matrix produces native Tauri v2 installers for:
#      - Linux x86_64 (saint-harness-desktop_<ver>_amd64.deb built on ubuntu-22.04)
#      - macOS arm64 & x64 (saint-harness-desktop_<ver>_aarch64.dmg, _x64.dmg)
#      - Windows x64 (saint-harness-desktop_<ver>_x64-setup.exe, _x64.msi)
#   4. Real container verification installs CLI amd64.deb on Debian 12, Debian 13, Ubuntu 22.04, Ubuntu 24.04.
#   5. Publish generates SHA256SUMS.txt, release-manifest.json, package manager manifests, attaches
#      install.sh/install.ps1, and idempotently creates or updates the GitHub Release.
name: Release SaintHarness

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0 or v0.2.0)"
        required: true
        type: string
      publish_release:
        description: "Publish archives, installers, desktop bundles, and manifest to GitHub Releases"
        required: true
        default: false
        type: boolean
      include_desktop:
        description: "Build and attach native Tauri v2 Desktop App installers (.deb, .dmg, .exe, .msi)"
        required: false
        default: true
        type: boolean
      platform:
        description: "Target platform scope"
        required: false
        type: choice
        default: all
        options: [all, linux-x64, linux-arm64, mac-arm64, mac-x64, win-x64]

permissions: {}

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: saint-harness-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight & Quality Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      publish_release: ${{ steps.release_mode.outputs.publish_release }}
      include_desktop: ${{ steps.release_mode.outputs.include_desktop }}
      matrix: ${{ steps.build_matrix.outputs.include }}
      desktop_matrix: ${{ steps.build_matrix.outputs.desktop_include }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: release_mode
        name: Resolve publication and desktop mode
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}
          INCLUDE_DESKTOP: ${{ github.event_name == 'push' || inputs.include_desktop }}
        run: |
          echo "publish_release=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"
          echo "include_desktop=$INCLUDE_DESKTOP" >> "$GITHUB_OUTPUT"

      - id: build_matrix
        name: Resolve target CLI and Desktop build matrices
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          ALL='[
            {"id":"linux-x64","label":"Linux x86_64 (Ubuntu/Debian)","runner":"ubuntu-22.04","platform":"linux","arch":"x86_64","deb_arch":"amd64","rust_target":"x86_64-unknown-linux-gnu"},
            {"id":"linux-arm64","label":"Linux aarch64 (Ubuntu/Debian)","runner":"ubuntu-22.04-arm","platform":"linux","arch":"aarch64","deb_arch":"arm64","rust_target":"aarch64-unknown-linux-gnu"},
            {"id":"mac-arm64","label":"macOS arm64","runner":"macos-15","platform":"mac","arch":"arm64","deb_arch":"","rust_target":"aarch64-apple-darwin"},
            {"id":"mac-x64","label":"macOS x86_64","runner":"macos-15","platform":"mac","arch":"x86_64","deb_arch":"","rust_target":"x86_64-apple-darwin"},
            {"id":"win-x64","label":"Windows x64","runner":"windows-2022","platform":"win","arch":"x86_64","deb_arch":"","rust_target":"x86_64-pc-windows-msvc"}
          ]'
          ALL_DESKTOP='[
            {"id":"desktop-linux-x64","match_platform":"linux-x64","label":"Desktop Linux x86_64 (.deb)","runner":"ubuntu-22.04","platform":"linux","arch_tag":"amd64","rust_target":"x86_64-unknown-linux-gnu"},
            {"id":"desktop-mac-arm64","match_platform":"mac-arm64","label":"Desktop macOS arm64 (.dmg)","runner":"macos-15","platform":"mac","arch_tag":"aarch64","rust_target":"aarch64-apple-darwin"},
            {"id":"desktop-mac-x64","match_platform":"mac-x64","label":"Desktop macOS x86_64 (.dmg)","runner":"macos-15","platform":"mac","arch_tag":"x64","rust_target":"x86_64-apple-darwin"},
            {"id":"desktop-win-x64","match_platform":"win-x64","label":"Desktop Windows x64 (.exe/.msi)","runner":"windows-2022","platform":"win","arch_tag":"x64","rust_target":"x86_64-pc-windows-msvc"}
          ]'
          INCLUDE="$(jq -c --arg p "$PLATFORM" 'map(select($p == "all" or .id == $p))' <<<"$ALL")"
          DESKTOP_INCLUDE="$(jq -c --arg p "$PLATFORM" 'map(select($p == "all" or .match_platform == $p))' <<<"$ALL_DESKTOP")"
          echo "include=$INCLUDE" >> "$GITHUB_OUTPUT"
          echo "desktop_include=$DESKTOP_INCLUDE" >> "$GITHUB_OUTPUT"

      - id: release_meta
        name: Validate stable release version
        shell: bash
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
        run: |
          CLEAN_VERSION="$(python3 scripts/release/sync-version.py --normalize "$RAW_VERSION")"
          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$CLEAN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          cache-key: release-preflight

      - name: Run full preflight gates (contracts, cleanroom, firewall, UI parity, clippy, tests)
        run: |
          python3 .github/scripts/test_ci_contracts.py
          bash scripts/check-cleanroom.sh
          bash scripts/check-firewall.sh
          bash scripts/check-prototype-parity.sh
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked

  build_release:
    name: Build CLI (${{ matrix.label }})
    needs: [preflight]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.rust_target }}
          cache-key: release-${{ matrix.id }}

      - name: Synchronize workspace release version
        shell: bash
        run: |
          PYTHON_BIN="python3"
          command -v "$PYTHON_BIN" >/dev/null 2>&1 || PYTHON_BIN="python"
          "$PYTHON_BIN" scripts/release/sync-version.py --sync "${{ needs.preflight.outputs.version }}"

      - name: Build stripped release binary (with ACP bridge)
        shell: bash
        run: |
          cargo build --release --target "${{ matrix.rust_target }}" -p saint-harness-cli --features acp

      - name: Verify Mach-O architecture and optionally sign macOS binary
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.rust_target }}/release/saint-harness"
          ARCHS="$(lipo -archs "$BIN")"
          echo "Mach-O architectures: $ARCHS"
          EXPECTED_MAC_ARCH="${{ matrix.arch }}"
          if [[ "$ARCHS" != *"$EXPECTED_MAC_ARCH"* ]]; then
            echo "Expected Mach-O arch $EXPECTED_MAC_ARCH, got $ARCHS" >&2
            exit 1
          fi
          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$BIN"
            codesign --verify --strict --verbose=2 "$BIN"
          else
            codesign --force --sign - "$BIN"
          fi

      - name: Smoke-test native release binary (Unix)
        if: matrix.platform == 'linux' || (matrix.platform == 'mac' && matrix.arch == 'arm64')
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.rust_target }}/release/saint-harness"
          "$BIN" --version
          "$BIN" models --json | grep -q '"hardcodedProviderVersions": 0'
          set +e
          "$BIN" server status --url http://127.0.0.1:1 --json
          rc=$?
          set -e
          test "$rc" -eq 1

      - name: Smoke-test native release binary (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.rust_target }}/release/saint-harness.exe"
          & $bin --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $models = & $bin models --json | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($models -notmatch '"hardcodedProviderVersions": 0') {
            throw "Unexpected models --json output: $models"
          }
          $PSNativeCommandUseErrorActionPreference = $false
          & $bin server status --url http://127.0.0.1:1 --json | Out-Null
          if ($LASTEXITCODE -ne 1) {
            throw "Expected exit code 1 for offline server status, got $LASTEXITCODE"
          }
          exit 0

      - name: Package Linux tarball and verified Debian/Ubuntu .deb
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ needs.preflight.outputs.version }}"
          BIN="target/${{ matrix.rust_target }}/release/saint-harness"
          mkdir -p release-assets
          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT
          install -m 0755 "$BIN" "$STAGE/saint-harness"
          tar -C "$STAGE" -czf "release-assets/saint-harness_${VER}_linux-${{ matrix.arch }}.tar.gz" saint-harness
          bash scripts/release/build-deb.sh \
            --binary "$BIN" \
            --version "$VER" \
            --arch "${{ matrix.deb_arch }}" \
            --out-dir release-assets
          ls -lh release-assets/

      - name: Package macOS tarball
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ needs.preflight.outputs.version }}"
          BIN="target/${{ matrix.rust_target }}/release/saint-harness"
          mkdir -p release-assets
          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT
          install -m 0755 "$BIN" "$STAGE/saint-harness"
          tar -C "$STAGE" -czf "release-assets/saint-harness_${VER}_darwin-${{ matrix.arch }}.tar.gz" saint-harness
          ls -lh release-assets/

      - name: Package Windows zip archive
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ver = "${{ needs.preflight.outputs.version }}"
          $bin = "target/${{ matrix.rust_target }}/release/saint-harness.exe"
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Compress-Archive -Path $bin -DestinationPath "release-assets/saint-harness_${ver}_windows-${{ matrix.arch }}.zip" -Force
          Get-ChildItem release-assets

      - name: Upload platform CLI release assets
        uses: actions/upload-artifact@v4
        with:
          name: saint-harness-${{ matrix.id }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  build_desktop:
    name: Build (${{ matrix.label }})
    needs: [preflight]
    if: >-
      needs.preflight.outputs.include_desktop == 'true' &&
      needs.preflight.outputs.desktop_matrix != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.desktop_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux WebKitGTK & GTK3 build dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.rust_target }}
          workspaces: apps/desktop/src-tauri
          cache-key: release-${{ matrix.id }}

      - name: Synchronize CLI and Desktop release version
        shell: bash
        run: |
          PYTHON_BIN="python3"
          command -v "$PYTHON_BIN" >/dev/null 2>&1 || PYTHON_BIN="python"
          "$PYTHON_BIN" scripts/release/sync-version.py --sync "${{ needs.preflight.outputs.version }}"

      - name: Install Tauri CLI dependencies
        working-directory: apps/desktop
        shell: bash
        run: npm ci

      - name: Build Tauri v2 Desktop installer (Linux .deb)
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ needs.preflight.outputs.version }}"
          npx tauri build --ci --target "${{ matrix.rust_target }}" --bundles deb
          mkdir -p ../../desktop-assets
          DEB_FILE="$(find "src-tauri/target/${{ matrix.rust_target }}/release/bundle/deb" -maxdepth 1 -name '*.deb' | head -n 1)"
          test -n "$DEB_FILE"
          cp "$DEB_FILE" "../../desktop-assets/saint-harness-desktop_${VER}_${{ matrix.arch_tag }}.deb"
          ls -lh ../../desktop-assets/

      - name: Build Tauri v2 Desktop installer (macOS .dmg)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ needs.preflight.outputs.version }}"
          npx tauri build --ci --target "${{ matrix.rust_target }}" --bundles dmg
          mkdir -p ../../desktop-assets
          DMG_FILE="$(find "src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)"
          test -n "$DMG_FILE"
          cp "$DMG_FILE" "../../desktop-assets/saint-harness-desktop_${VER}_${{ matrix.arch_tag }}.dmg"
          ls -lh ../../desktop-assets/

      - name: Build Tauri v2 Desktop installers (Windows .exe and .msi)
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ver = "${{ needs.preflight.outputs.version }}"
          $target = "${{ matrix.rust_target }}"
          npx tauri build --ci --target $target --bundles msi,nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path "..\..\desktop-assets" -Force | Out-Null
          $exe = Get-ChildItem "src-tauri\target\$target\release\bundle\nsis\*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "src-tauri\target\$target\release\bundle\msi\*.msi" | Select-Object -First 1
          if (-not $exe -or -not $msi) { throw "Missing Windows NSIS/MSI desktop bundles" }
          Copy-Item $exe.FullName "..\..\desktop-assets\saint-harness-desktop_${ver}_x64-setup.exe" -Force
          Copy-Item $msi.FullName "..\..\desktop-assets\saint-harness-desktop_${ver}_x64.msi" -Force
          Get-ChildItem "..\..\desktop-assets"

      - name: Upload Desktop installer assets
        uses: actions/upload-artifact@v4
        with:
          name: saint-harness-${{ matrix.id }}
          path: desktop-assets/*
          if-no-files-found: error
          retention-days: 14

  # Real distro install verification: proves the CLI amd64.deb installs cleanly and runs
  # on Debian 12, Debian 13, Ubuntu 22.04, and Ubuntu 24.04 without missing deps or glibc errors.
  verify_debian_ubuntu:
    name: Verify .deb install (${{ matrix.distro }})
    needs: [preflight, build_release]
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'linux-x64'
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.distro }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian:bookworm
          - debian:trixie
          - ubuntu:22.04
          - ubuntu:24.04
    steps:
      - name: Download Linux x64 CLI release assets
        uses: actions/download-artifact@v4
        with:
          name: saint-harness-linux-x64
          path: dist

      - name: Install .deb via apt-get and run CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y ./dist/saint-harness_*_amd64.deb
          saint-harness --version
          saint-harness models --json | grep -q '"hardcodedProviderVersions": 0'
          set +e
          saint-harness server status --url http://127.0.0.1:1 --json
          rc=$?
          set -e
          test "$rc" -eq 1

  publish_release:
    name: Publish GitHub Release
    needs: [preflight, build_release, build_desktop, verify_debian_ubuntu]
    if: >-
      !failure() && !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.build_release.result == 'success' &&
      needs.verify_debian_ubuntu.result == 'success' &&
      (needs.build_desktop.result == 'success' || (needs.preflight.outputs.include_desktop != 'true' && needs.build_desktop.result == 'skipped')) &&
      needs.preflight.outputs.publish_release == 'true' &&
      (inputs.platform == '' || inputs.platform == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all CLI and Desktop release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: saint-harness-*
          path: release-artifacts
          merge-multiple: true

      - name: Stage cross-platform installer scripts
        run: |
          cp scripts/install.sh release-artifacts/install.sh
          cp scripts/install.ps1 release-artifacts/install.ps1
          chmod +x release-artifacts/install.sh

      - name: Generate SHA256SUMS.txt, release-manifest.json, and package manager manifests
        env:
          INCLUDE_DESKTOP: ${{ needs.preflight.outputs.include_desktop }}
        run: |
          EXTRA_ARGS=()
          if [ "$INCLUDE_DESKTOP" = "true" ]; then
            EXTRA_ARGS+=(--require-desktop)
          fi
          python3 scripts/release/generate-manifest.py \
            --artifacts-dir release-artifacts \
            --version "${{ needs.preflight.outputs.version }}" \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --commit "${{ github.sha }}" \
            --out-dir release-artifacts \
            "${EXTRA_ARGS[@]}"
          python3 scripts/release/generate-package-manifests.py \
            --manifest release-artifacts/release-manifest.json \
            --repo "${{ github.repository }}" \
            --out-dir release-artifacts
          tar -C release-artifacts -czf release-artifacts/saint-harness_${{ needs.preflight.outputs.version }}_winget-manifests.tar.gz winget
          rm -rf release-artifacts/winget
          cat release-artifacts/SHA256SUMS.txt
          cat release-artifacts/release-manifest.json
          cat release-artifacts/saint-harness.rb
          cat release-artifacts/saint-harness.scoop.json

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --clobber
          else
            gh release create "$TAG" release-artifacts/* \
              --target "$GITHUB_SHA" \
              --title "SaintHarness v$VERSION" \
              --generate-notes \
              --latest
          fi
