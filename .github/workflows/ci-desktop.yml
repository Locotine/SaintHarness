# Native Tauri v2 Desktop CI across Linux, macOS, and Windows.
# Kept separate from ci.yml so headless CLI-only PRs stay fast and zero-WebKit.
name: Desktop CI

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/saint-harness-server/**"
      - "crates/saint-harness-protocol/**"
      - "crates/saint-harness-schema/**"
      - "scripts/install-desktop-linux.sh"
      - ".github/workflows/ci-desktop.yml"
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "crates/saint-harness-server/**"
      - "crates/saint-harness-protocol/**"
      - "crates/saint-harness-schema/**"
      - "scripts/install-desktop-linux.sh"
      - ".github/workflows/ci-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  desktop-linux:
    name: Desktop Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WebKitGTK and GTK3 system libraries
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Setup Node.js for UI syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Desktop frontend JavaScript syntax
        run: |
          node --check apps/desktop/ui/saint-logo.js
          node --check apps/desktop/ui/app.js

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          workspaces: apps/desktop/src-tauri
          cache-key: desktop-ci-linux

      - name: Format, clippy (-D warnings), and unit tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked

  desktop-macos:
    name: Desktop macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy
          workspaces: apps/desktop/src-tauri
          cache-key: desktop-ci-macos

      - name: Clippy (-D warnings) and unit tests on macOS
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --locked

  desktop-windows:
    name: Desktop Windows (x64 MSVC)
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy
          workspaces: apps/desktop/src-tauri
          cache-key: desktop-ci-windows

      - name: Clippy (-D warnings) and unit tests on Windows
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --locked
